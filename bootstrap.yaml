AWSTemplateFormatVersion: 2010-09-09

Resources:
  GitHubActionsCicdUser:
    Type: AWS::IAM::User
    Properties:
      UserName: github-actions-mfl-scoring
      Policies:
        - PolicyName: GitHubActionsCicdPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                Resource: "*"
              - Sid: LambdaAccess
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:PublishVersion
                  - lambda:UpdateAlias
                  - lambda:GetAlias
                  - lambda:ListVersionsByFunction
                  - lambda:GetFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:mfl-scoring*"
              - Sid: LambdaListAccess
                Effect: Allow
                Action:
                  - lambda:ListFunctions
                Resource: "*"
              - Sid: STSAccess
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"
              - Sid: WebBucketAccess
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::mfl.timkelsch.com"
              - Sid: WebBucketObjectAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::mfl.timkelsch.com/*"

  GitHubActionsCicdUserAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref GitHubActionsCicdUser

Outputs:
  GitHubActionsCicdUserName:
    Description: IAM User for GitHub Actions CI/CD
    Value: !Ref GitHubActionsCicdUser
    Export:
      Name: GitHubActionsCicdUserName
  GitHubActionsCicdAccessKeyId:
    Description: Access Key ID for GitHub Actions CI/CD User
    Value: !Ref GitHubActionsCicdUserAccessKey
  GitHubActionsCicdSecretAccessKey:
    Description: Secret Access Key for GitHub Actions CI/CD User
    Value: !GetAtt GitHubActionsCicdUserAccessKey.SecretAccessKey
